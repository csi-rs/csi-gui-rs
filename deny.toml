# cargo-deny: run with `cargo deny check` (CI runs advisories, licenses, sources).
[graph]
all-features = true

[advisories]
version = 2
# Unmaintained-crate notices with no maintained drop-in yet. None is a
# known vulnerability; revisit when the upstreams move.
ignore = [
    # atomic-polyfill, via heapless 0.7: the esp-csi-rs wire format is
    # defined with heapless 0.7 and the vendored module must match it.
    { id = "RUSTSEC-2023-0089", reason = "heapless 0.7 is pinned by the esp-csi-rs wire contract" },
    # paste, a proc-macro via nalgebra (savgol-rs).
    { id = "RUSTSEC-2024-0436", reason = "compile-time only, via savgol-rs → nalgebra" },
    # zbus_names / zvariant / zvariant_derive, via rfd's xdg-portal backend.
    { id = "RUSTSEC-2026-0370", reason = "via rfd xdg-portal (zbus)" },
    { id = "RUSTSEC-2026-0371", reason = "via rfd xdg-portal (zbus)" },
    { id = "RUSTSEC-2026-0372", reason = "via rfd xdg-portal (zbus)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "OFL-1.1",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "Ubuntu-font-1.0",
    "LicenseRef-UFL-1.0",
    "CDLA-Permissive-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
