[package]
name = "csi-gui-rs"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Desktop GUI for live Wi-Fi CSI capture from ESP32 boards running esp-csi-cli-rs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/csi-rs/csi-gui-rs"
readme = "README.md"
keywords = ["csi", "esp32", "wifi", "egui", "visualization"]
categories = ["visualization", "embedded", "hardware-support"]

[features]
default = []
rerun = ["dep:rerun"]

[dependencies]
eframe = { version = "0.34.2", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
egui = "0.34.2"
egui_plot = "0.35.0"

serialport = "4.3"
postcard = { version = "1.0", default-features = false, features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"

crossbeam-channel = "0.5"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
regex = "1"
anyhow = "1"
thiserror = "2.0.18"

rerun = { version = "0.32", optional = true, default-features = false, features = ["sdk"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
