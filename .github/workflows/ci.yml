name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
        if: runner.os == 'Linux'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked
      - run: cargo clippy --all-targets --all-features --locked
      - run: cargo test --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --dry-run --locked
      - name: Vendored wire module matches esp-csi-rs
        run: |
          git clone --depth 1 https://github.com/csi-rs/esp-csi-rs ../esp-csi-rs || exit 0
          scripts/sync-wire.sh --check ../esp-csi-rs || echo "::warning::src/protocol/wire differs from esp-csi-rs main; run scripts/sync-wire.sh"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources
